sudo: required
services:
  - docker

before_install:
  - docker build -f Dockerfile.dev -t goncalocoutinho/docker-react .

script:
  - docker run -e CI=true goncalocoutinho/docker-react npm run test

deploy:
  provider: elasticbeanstalk
  region: "eu-north-1"
  app: "frontend"
  env: "Frontend-env"
  bucket_name: "elasticbeanstalk-eu-north-1-344031022494"
  bucket_path: "docker"
  on:
    branch: master
  acess_key_id: $AWS_ACESS_KEY
  secret_access_key: $AWS_SECRET_KEY